name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --release --workspace
      - run: cargo build --release --examples
  # Every verdict must match Microsoft's Open XML SDK at the pinned release.
  agree:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: rustup target add wasm32-unknown-unknown
      - run: WORK=$RUNNER_TEMP/agree fuzz/agree.sh
      # The npm package's WebAssembly build reports what the native one does.
      - run: scripts/build-npm.sh && node npm/same.mjs target/release/ooxml-validator $RUNNER_TEMP/agree/docs/all.txt
