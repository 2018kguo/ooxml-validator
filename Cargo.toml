[package]
name = "obstat"
version = "0.1.0"
license = "MIT"
description = "A streaming .docx validator that gives the Open XML SDK's verdicts"
edition = "2024"

[dependencies]
memchr = "2"
rustc-hash = "2"
# zip inflates through flate2; this selects its zlib-rs backend (faster than miniz_oxide).
flate2 = { version = "1", default-features = false, features = ["zlib-rs"] }
regex = { version = "1", default-features = false, features = ["std", "perf", "unicode"] }
zip = { version = "2", default-features = false, features = ["deflate"] }

[workspace]
members = [".", "gen"]

[profile.release]
lto = "fat"
codegen-units = 1
panic = "abort"
