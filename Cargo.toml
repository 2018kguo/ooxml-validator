[package]
name = "proof"
version = "0.1.0"
license = "MIT"
description = "A streaming .docx validator that gives the Open XML SDK's verdicts"
edition = "2024"

[dependencies]
memchr = "2"
regex = { version = "1", default-features = false, features = ["std", "perf", "unicode"] }
zip = { version = "2", default-features = false, features = ["deflate"] }

[workspace]
members = [".", "gen"]

[profile.release]
lto = "fat"
codegen-units = 1
panic = "abort"
