[package]
name = "ooxml-validator"
version = "0.3.1"
license = "MIT"
description = "A streaming .docx, .xlsx and .pptx validator that gives the Open XML SDK's verdicts"
edition = "2024"
repository = "https://github.com/2018kguo/ooxml-validator"
readme = "README.md"
keywords = ["docx", "xlsx", "pptx", "ooxml", "validator"]
categories = ["parser-implementations", "command-line-utilities"]
# The crate is the library and CLI; tests against the SDK and the npm build stay in the repository.
exclude = ["fuzz", "bench", "npm", "docs", "scripts", ".github", "SDK_VERSION"]

[lib]
# cdylib: the WebAssembly build the npm package ships.
crate-type = ["cdylib", "rlib"]

[dependencies]
memchr = "2"
simdutf8 = "0.1"
rustc-hash = "2"
# zip inflates through flate2; this selects its zlib-rs backend (faster than miniz_oxide).
flate2 = { version = "1", default-features = false, features = ["zlib-rs"] }
# Only the Unicode classes the SDK's patterns use (\p{L}, \d); the patterns are short and run on
# few values, so the lazy DFA alone is fast enough, and the build is ~500 KB smaller.
regex = { version = "1", default-features = false, features = ["std", "perf-cache", "perf-dfa", "unicode-perl", "unicode-gencat"] }
zip = { version = "2", default-features = false, features = ["deflate"] }

[workspace]
members = [".", "gen"]

[profile.release]
lto = "fat"
codegen-units = 1
panic = "abort"
